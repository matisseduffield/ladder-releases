<style>
/* The list runs past a short screen: the page grows, so the bottom padding stays clear of the home bar */
.app { height: auto; min-height: 100dvh; }
.today { padding-top: 14px; }
.today h2 { font-size: 1.6rem; font-weight: 600; letter-spacing: -.015em; line-height: 1.2; }
.today p { margin-top: 2px; font-size: .92rem; color: var(--muted); }

/* A row for each game */
.games { display: grid; gap: 8px; margin-top: 16px; }
.game {
  display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 12px;
  min-height: 64px; padding: 9px 14px 9px 12px;
  background: var(--surface); border-radius: 10px;
  color: inherit; text-decoration: none;
}
.game:active { background: var(--key); }
.game b { display: block; font-size: 1.05rem; font-weight: 600; line-height: 1.3; }
.game span { display: block; font-size: .88rem; line-height: 1.35; color: var(--muted); }
.game .state { color: var(--faint); }
.game.done .state { color: var(--pos); }

.foot { margin-top: auto; padding: 18px 0 8px; text-align: center; }
.get-app { margin: 0 0 4px; font-size: .86rem; color: var(--muted); }
.get-app .link { font-size: .86rem; text-decoration: none; }
.install-hint { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0 0; font-size: .84rem; line-height: 1.35; color: var(--muted); }
.install-hint button { flex: none; width: 44px; height: 44px; margin: -10px -12px -10px 0; padding: 0; background: none; border: 0; font-size: 1.2rem; color: var(--muted); }
.legal { display: flex; justify-content: center; gap: 48px; }
.legal a { padding: 12px 8px; font-size: .84rem; color: var(--muted); text-decoration: none; }

/* App update (Android app only) */
.update { display: grid; gap: 14px; margin-top: 8px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.update-title { font-weight: 600; line-height: 1.3; }
.update-sub, .update-msg { font-size: .84rem; color: var(--muted); }
.update-notes { margin: 0; padding: 0 0 0 16px; font-size: .88rem; line-height: 1.4; }
.share-all { width: 100%; margin-top: 14px; }
.update-progress { display: flex; align-items: center; gap: 12px; min-height: 46px; }
.update-track { flex: 1; height: 6px; border-radius: 3px; background: var(--accent-soft); overflow: hidden; }
.update-track span { display: block; height: 100%; width: 0; border-radius: 3px; background: var(--accent); transition: width .2s; }
.update-pct { min-width: 3.2ch; text-align: right; font-size: .86rem; font-weight: 600; }
@media (prefers-reduced-motion: reduce) { .update-track span { transition: none; } }
</style>
</head>

</div>

  const WEAVE = '<rect width="64" height="64" rx="14" fill="#12838E"/><rect x="7" y="32" width="11.6" height="11.6" rx="2.4" fill="#FFFFFF"/><text x="12.8" y="41.8" font-size="10.4" font-weight="600" font-family="Hanken Grotesk,Segoe UI,sans-serif" text-anchor="middle" fill="#14211C">M</text><rect x="19.7" y="32" width="11.6" height="11.6" rx="2.4" fill="#FFCF33"/><text x="25.5" y="41.8" font-size="10.4" font-weight="600" font-family="Hanken Grotesk,Segoe UI,sans-serif" text-anchor="middle" fill="#14211C">N</text><rect x="32.4" y="32" width="11.6" height="11.6" rx="2.4" fill="#FFCF33"/><text x="38.2" y="41.8" font-size="10.4" font-weight="600" font-family="Hanken Grotesk,Segoe UI,sans-serif" text-anchor="middle" fill="#14211C">E</text><rect x="45.099999999999994" y="32" width="11.6" height="11.6" rx="2.4" fill="#FFFFFF"/><text x="50.89999999999999" y="41.8" font-size="10.4" font-weight="600" font-family="Hanken Grotesk,Segoe UI,sans-serif" text-anchor="middle" fill="#14211C">D</text><path d="M25.5,27.5C25.5,14 38.5,14 38.5,27.5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/><path d="M21.6,24L25.5,28.5L29.4,24M34.6,24L38.5,28.5L42.4,24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>';

  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem('hub.' + k)); } catch { return null; } },

  const dateFormat = new Intl.DateTimeFormat(navigator.language || 'en', { weekday: 'long', day: 'numeric', month: 'long' });

  let shownDay = '';
  function render() {
    const now = Clock.now(), day = now.toDateString();
    let done = 0;
    shownDay = day;
    $('date').textContent = dateFormat.format(now);
    $('games').replaceChildren(...GAMES.map(g => {
      const result = store.get(g.id);
      const played = !!result && result.date === day;
      if (played) done++;
      const a = el('a', played ? 'game done' : 'game');
      a.href = `${g.id}/index.html`;
      a.innerHTML = `<svg width="40" height="40" viewBox="0 0 64 64" fill="none" aria-hidden="true">${g.icon}</svg>`;
      const text = el('div');
      text.append(el('b', '', g.name), el('span', '', played ? result.text : g.line));
      a.append(text, el('span', 'state', played ? 'Done' : 'Play'));
      return a;
    }));
    $('progress').textContent = done === GAMES.length ? 'All done. See you tomorrow.' : `${done} of ${GAMES.length} played today`;
    $('shareAll').hidden = done !== GAMES.length;
  }
  // Every result in one message, once the day's games are done.
  function shareAll() {
    const lines = GAMES.map(g => `${g.name}: ${(store.get(g.id) || {}).text || ''}`);
    const text = [`Dailies, ${dateFormat.format(Clock.now())}`, ...lines, SITE].join('\n');
    if (window.ladderApp) return toApp({ type: 'share', title: 'Dailies', text });
    if (navigator.share) return navigator.share({ text }).catch(() => {});
    navigator.clipboard.writeText(text).then(() => {
      $('shareAll').textContent = 'Copied';
      setTimeout(() => { $('shareAll').textContent = 'Share today'; }, 1600);
    }, () => {});
  }
  $('shareAll').addEventListener('click', shareAll);

  // Coming back from a game, or back to the app on a new day.
  addEventListener('pageshow', render);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
  addEventListener('clock', render);
  setInterval(() => { if (!document.hidden && Clock.now().toDateString() !== shownDay) render(); }, 30000);

  // ---- Android app bridge (absent in a browser) ----
  const app = window.ladderApp || null;
  function toApp(msg) {
    if (!app) return;
    try { app.postMessage(JSON.stringify(msg)); } catch {}
  }
  // selfUpdates is off until the app says otherwise: Play builds update through
  // the store, so there the version is a plain label with nothing to tap.
  let appVersion = '', selfUpdates = false, updateReady = false, versionTimer = 0, updateVersion = '', updateSize = 0;
  function showVersion(text, st) {
    clearTimeout(versionTimer);
    $('version').hidden = false;
    $('version').textContent = text;
    $('version').dataset.state = st || '';
  }
  function showUpdate(m) {
    const show = (id, on) => { $(id).hidden = !on; };
    $('updateCard').hidden = false;
    if (m.state === 'available') {
      updateVersion = m.version || updateVersion;
      updateSize = m.size > 0 ? m.size : updateSize;
      const notes = Array.isArray(m.notes) ? m.notes.filter(n => typeof n === 'string' && n).slice(0, 5) : [];
      $('updateNotes').replaceChildren(...notes.map(n => el('li', '', n)));
      show('updateNotes', notes.length > 0);
    }
    const view = {
      available: { title: 'Update available', msg: '', actions: true, progress: false, go: 'Update' },
      downloading: { title: 'Downloading update', msg: '', actions: false, progress: true },
      installing: { title: 'Installing update', actions: false, progress: true, msg: 'Confirm on the next screen. The first time, Android asks you to allow installs from Dailies. Turn it on, then go back.' },
      failed: { title: "Update didn't finish", msg: m.message || 'Something went wrong. Try again.', actions: true, progress: false, go: 'Try again' },
    }[m.state];
    if (!view) return;
    $('updateTitle').textContent = view.title;
    $('updateSub').textContent = [`Dailies ${updateVersion}`, updateSize ? `${(updateSize / 1e6).toFixed(1)} MB` : ''].filter(Boolean).join(' · ');
    $('updateMsg').textContent = view.msg;
    show('updateMsg', !!view.msg);
    show('updateActions', view.actions);
    show('updateProgress', view.progress);
    if (view.go) $('updateGo').textContent = view.go;
    if (view.progress) {
      const p = m.state === 'installing' ? 100 : Math.round(Math.max(0, Math.min(1, m.progress || 0)) * 100);
      $('updateBar').style.width = p + '%';
      $('updatePct').textContent = p + '%';
    }
  }
  if (app) {
    app.onmessage = e => {
      let m;
      try { m = JSON.parse(e.data); } catch { return; }
      if (m.type === 'info') {
        appVersion = m.version;
        selfUpdates = m.updates === true;
        $('version').disabled = !selfUpdates;
        if (!selfUpdates) $('version').removeAttribute('title');
        const seen = store.get('seenVersion');
        store.set('seenVersion', appVersion);
        if (selfUpdates && !updateReady && seen && seen !== appVersion) {
          showVersion(`Updated to v${appVersion}`, 'available');
          versionTimer = setTimeout(() => showVersion(`v${appVersion}`), 4000);
        } else if (!updateReady) showVersion(`v${appVersion}`);
      } else if (m.type === 'updateStatus' && selfUpdates) {
        if (m.state === 'available') { updateReady = true; return showVersion('Update available', 'available'); }
        showVersion(m.state === 'latest' ? 'Up to date' : "Couldn't check");
        versionTimer = setTimeout(() => showVersion(`v${appVersion}`), 2500);
      } else if (m.type === 'update' && selfUpdates) {
        if (m.state === 'available') { updateReady = true; showVersion('Update available', 'available'); }
        showUpdate(m);
      }
    };
    $('updateGo').addEventListener('click', () => { showUpdate({ state: 'downloading', progress: 0 }); toApp({ type: 'installUpdate' }); });
    $('updateLater').addEventListener('click', () => { $('updateCard').hidden = true; });
    $('version').addEventListener('click', () => {
      if (updateReady) { $('updateCard').hidden = false; return; }
      showVersion('Checking…');
      toApp({ type: 'checkUpdate' });
    });
  }

  // ---- boot ----
  $('getApp').hidden = !!app || inApp || !/Android/.test(navigator.userAgent);
  render();
  toApp({ type: 'hello' });
})();
</script>
</body>
</html>
